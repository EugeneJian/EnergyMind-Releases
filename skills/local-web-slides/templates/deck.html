<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; base-uri 'none'; form-action 'none'">
<title>演示标题</title>
<style>
/* Theme: replace tokens and layout after style selection. */
:root {
  --surround: #151c1a;
  --page: #f5f2ea;
  --ink: #172b25;
  --accent: #245744;
  --pad: 112px;
  --display: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  --body: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  overflow: hidden;
  background: var(--surround);
  color: var(--ink);
  font-family: var(--body);
}
/* Fixed design canvas; the script scales it to the available viewing area. */
#viewport { position: relative; min-width: 0; overflow: hidden; }
#stage {
  position: absolute;
  inset: 0 auto auto 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
}
.slide {
  position: absolute;
  inset: 0;
  overflow: hidden;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  padding: var(--pad);
  display: grid;
  align-content: center;
  background: var(--page);
}
.slide.active { visibility: visible; opacity: 1; pointer-events: auto; }
.slide img, .slide svg { max-width: 100%; max-height: 100%; }
.slide h1, .slide h2 { margin: 0 0 42px; line-height: 1.12; font-family: var(--display); }
.slide h1 { font-size: 112px; }
.slide h2 { font-size: 76px; }
.slide p { margin: 0; font-size: 42px; line-height: 1.45; }
.slide .kicker { margin-bottom: 24px; font-size: 32px; font-weight: 700; color: var(--accent); }
.slide .rule { width: 160px; height: 8px; margin-bottom: 42px; background: var(--accent); }
#controls { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px; color: white; }
#controls[hidden] { display: none; }
#controls button { min-width: 44px; min-height: 44px; border: 1px solid #fff9; border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
#controls button[aria-disabled="true"] { opacity: .45; cursor: default; }
#controls button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#page { min-width: 5ch; text-align: center; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="viewport">
  <main id="stage" aria-label="幻灯片">
    <!-- Replace sample slides with the user's content; keep the slide structure. -->
    <section class="slide active" aria-labelledby="title-1">
      <p class="kicker">主题系列</p>
      <h1 id="title-1">演示标题</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>一句话交代这场演示要解决的问题。</p>
    </section>
    <section class="slide" aria-labelledby="title-2" aria-hidden="true" inert>
      <h2 id="title-2">把本页结论写成标题</h2>
      <div class="rule" aria-hidden="true"></div>
      <p>在此放置支撑结论的事实、图表或简短行动建议。</p>
    </section>
  </main>
</div>
<nav id="controls" aria-label="幻灯片导航" hidden>
  <button type="button" id="prev" aria-label="上一页">←</button>
  <output id="page" aria-live="polite"></output>
  <button type="button" id="next" aria-label="下一页">→</button>
</nav>
<script>
(() => {
  'use strict';
  const viewport = document.querySelector('#viewport');
  const stage = document.querySelector('#stage');
  const slides = Array.from(stage.querySelectorAll('.slide'));
  if (!slides.length) return;
  const controls = document.querySelector('#controls');
  const prev = document.querySelector('#prev');
  const next = document.querySelector('#next');
  const page = document.querySelector('#page');
  let index = 0;
  const fit = () => {
    const { clientWidth: w, clientHeight: h } = viewport;
    const s = Math.min(w / 1920, h / 1080);
    stage.style.transform = `translate(${(w - 1920 * s) / 2}px, ${(h - 1080 * s) / 2}px) scale(${s})`;
  };
  const show = n => {
    const target = Math.max(0, Math.min(slides.length - 1, n));
    if (target !== index && slides[index].contains(document.activeElement)) document.activeElement.blur();
    index = target;
    slides.forEach((slide, i) => {
      const on = i === index;
      slide.classList.toggle('active', on);
      slide.inert = !on;
      if (on) slide.removeAttribute('aria-hidden');
      else slide.setAttribute('aria-hidden', 'true');
    });
    page.textContent = `${index + 1} / ${slides.length}`;
    prev.setAttribute('aria-disabled', String(index === 0));
    next.setAttribute('aria-disabled', String(index === slides.length - 1));
  };
  controls.hidden = slides.length < 2;
  prev.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.ctrlKey || event.altKey || event.metaKey || event.shiftKey ||
        event.target?.closest?.('input, textarea, select, button, a, [contenteditable]')) return;
    let target;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) target = index + 1;
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) target = index - 1;
    else if (event.key === 'Home') target = 0;
    else if (event.key === 'End') target = slides.length - 1;
    else return;
    event.preventDefault();
    show(target);
  });
  window.addEventListener('resize', fit);
  show(0);
  fit();
})();
</script>
</body>
</html>
